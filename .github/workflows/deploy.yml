name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${{ vars.DEPLOY_PATH || '/home/admin/new-hr-forum/flarum/packages/freehuaren-post-font-size' }}"
            FLARUM_CONTAINER="${{ vars.FLARUM_CONTAINER || 'new-hr-forum-flarum-1' }}"

            cd "$DEPLOY_PATH"
            git fetch origin
            git reset --hard origin/main

            cd js
            docker run --rm -v "$PWD:/app" -w /app node:22-alpine sh -c "npm install && npm run build"
            cd ..

            docker exec "$FLARUM_CONTAINER" php /app/flarum cache:clear
